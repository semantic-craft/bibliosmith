schema = 1

# This registry is intentionally non-secret: only endpoints and default models.
# Credentials are resolved at runtime from key_env — either the repository-root
# .env, or, when the launcher stores them in the macOS Keychain, injected into
# that variable by the Rust runner before the engine starts.
#
# provider_type names the wire protocol. openai-compatible appends
# /chat/completions, openai-responses appends /responses, and gemini-native uses
# GenerateContent. A brand that bills two supported ways (currently MiMo) has one
# entry per config_id so its keys cannot be mixed. The default model here is only
# a starting point; a run may override it.
#
# concurrency_limit is how many chapters the engine translates at once against
# this service; chunks inside a chapter stay serial regardless. Chunk size is not
# set here: the run manifest's maxTokens is the single source of truth for it.

[[providers]]
profile_id = "openai-compatible"
config_id = "openai-default"
provider_type = "openai-compatible"
base_url = "https://api.openai.com/v1"
model = "gpt-4.1-mini"
timeout_seconds = 120
concurrency_limit = 4
key_env = "OPENAI_COMPATIBLE_API_KEYS"

[[providers]]
profile_id = "gemini-native"
config_id = "gemini-default"
provider_type = "gemini-native"
base_url = "https://generativelanguage.googleapis.com/v1beta"
model = "gemini-2.5-flash"
timeout_seconds = 120
concurrency_limit = 4
key_env = "GEMINI_API_KEYS"

# DeepSeek. base_url has no /v1 suffix: DeepSeek serves /chat/completions at the
# host root. deepseek-chat is deprecated 2026-07-24 in favour of deepseek-v4-flash
# (its non-thinking mode), so the default points there.
[[providers]]
profile_id = "deepseek"
config_id = "deepseek-default"
provider_type = "openai-compatible"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
timeout_seconds = 120
concurrency_limit = 4
key_env = "DEEPSEEK_API_KEYS"

# Kimi (Moonshot). OpenAI-compatible at the /v1 host.
[[providers]]
profile_id = "kimi"
config_id = "kimi-default"
provider_type = "openai-compatible"
base_url = "https://api.moonshot.ai/v1"
model = "kimi-k2.6"
timeout_seconds = 120
concurrency_limit = 4
key_env = "KIMI_API_KEYS"

# Qwen (Alibaba Model Studio / DashScope), pay-as-you-go Responses route.
[[providers]]
profile_id = "qwen"
config_id = "payg"
provider_type = "openai-responses"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
base_url_env = "QWEN_API_BASE_URL"
web_search_env = "QWEN_WEB_SEARCH_ENABLED"
model = "qwen3.7-max"
timeout_seconds = 120
concurrency_limit = 4
key_env = "QWEN_PAYG_API_KEYS"

# Doubao (Volcengine Ark), standard pay-as-you-go Responses route in Beijing.
# Ark requires a complete versioned model ID or an ep-* inference endpoint ID;
# the launcher therefore also lets the user replace this default when needed.
[[providers]]
profile_id = "doubao"
config_id = "cn-beijing"
provider_type = "openai-responses"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
model = "doubao-seed-2-1-pro-260628"
timeout_seconds = 120
concurrency_limit = 4
key_env = "VOLCENGINE_ARK_API_KEYS"

# Xiaomi MiMo, pay-as-you-go route.
[[providers]]
profile_id = "mimo"
config_id = "payg"
provider_type = "openai-compatible"
base_url = "https://api.xiaomimimo.com/v1"
model = "mimo-v2.5"
timeout_seconds = 120
concurrency_limit = 4
key_env = "MIMO_PAYG_API_KEYS"

# Xiaomi MiMo Token Plan: separate host and key, same as the Qwen split.
[[providers]]
profile_id = "mimo"
config_id = "token-plan"
provider_type = "openai-compatible"
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
model = "mimo-v2.5"
timeout_seconds = 120
concurrency_limit = 4
key_env = "MIMO_TOKEN_PLAN_API_KEYS"
