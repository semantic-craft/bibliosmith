[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[project]
name = "translation-engine"
version = "0.1.0"
description = "Local Markdown translation engine adapter"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
translation-engine = "translation_engine.cli:main"
translation-engine-ner = "translation_engine.ner_cli:main"
translation-engine-sample = "translation_engine.sample_cli:main"
translation-engine-prompt-preview = "translation_engine.prompt_preview_cli:main"

[tool.pytest.ini_options]
# `pythonpath` puts the src/ layout on sys.path so the tests import the working
# tree directly. Without it they only pass while the package happens to be
# installed in the venv, and a plain `uv sync` at the workspace root evicts it.
testpaths = ["tests"]
pythonpath = ["src"]
