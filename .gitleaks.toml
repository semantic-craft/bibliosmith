# gitleaks configuration for BiblioSmith — secret rules only.
#
# Personal-info / system-info rules live in .gitleaks-personal.toml and are
# scanned in a second pass. They cannot share this file: `[extend] useDefault`
# inherits gitleaks' global allowlist, which silently drops every `/home/...`
# match (issue #77). Keep the two configs separate so secrets keep the full
# default ruleset while home-path detection stays complete.
#
# Used by tools/git/hooks/pre-commit, tools/git/hooks/pre-push and the CI
# secrets job. A clean tree scans to zero findings under both configs.
title = "BiblioSmith secrets"

[extend]
useDefault = true

[allowlist]
description = "Known false positives for default secret rules"
regexes = [
  # engine.py emits a token-counting algorithm version string, not a secret.
  '''utf8-byte-upper-bound-v1''',
]
paths = [
  # Sibling personal-info config necessarily contains path-shaped patterns.
  '''\.gitleaks.*\.toml$''',
]
