# gitleaks configuration for BiblioSmith.
#
# Extends the default secret ruleset with the categories that secret scanners —
# GitHub push protection included — do not detect at all: absolute developer
# home paths and private network addresses.
#
# These rules are deliberately GENERIC. A guard against publishing personal data
# must not itself publish that data, so no real user name, e-mail address or
# machine name appears here. Identifier-specific checks are done by hash in
# tests/test_public_privacy.py instead.
#
# Used by tools/git/hooks/pre-commit, tools/git/hooks/pre-push and the CI
# secrets job, so a clean tree scans to zero findings.
title = "BiblioSmith"

[extend]
useDefault = true

[[rules]]
id = "developer-home-path"
description = "Absolute path into a developer home directory"
regex = '''(?:/Users/|/home/)[A-Za-z0-9._-]{2,32}/'''
tags = ["personal-info"]

[[rules]]
id = "private-network-address"
description = "Private-range IPv4 address"
regex = '''\b(?:192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
tags = ["system-info"]

[allowlist]
description = "Known false positives"
regexes = [
  # engine.py emits a token-counting algorithm version string, not a secret.
  '''utf8-byte-upper-bound-v1''',
]
paths = [
  # This config necessarily contains the patterns it searches for.
  '''\.gitleaks\.toml''',
]
