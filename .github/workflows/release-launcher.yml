name: Release Launcher

# Builds the macOS (Apple Silicon) DMG on a GitHub-hosted macos-latest runner
# and publishes it as a GitHub release on the public download repo
# semantic-craft/bibliosmith-releases (manual download only — the app has
# no self-update).
#
# One-time setup: repo secret RELEASE_TOKEN — a token with Contents: Read
# and write on semantic-craft/bibliosmith-releases.
#
# Release flow: update tools/bibliosmith-launcher/source/launcher-version.json
# and tools/bibliosmith-launcher/source/RELEASE_NOTES.md — whose first line must
# read `# v<version>` — merge to main, then push a matching tag (e.g. v1.4.0).
# The tag runs the full CI suite first and the build only starts once it is
# green, so a tag on a red tree publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.4.0); must match launcher-version.json"
        required: true

concurrency: release-launcher

permissions:
  contents: read

jobs:
  # A tag used to go straight to build-and-release, so a red suite could still
  # ship a DMG to the public download repo. ci.yml is reused here rather than
  # copied so the release gate cannot drift from the pull-request gate.
  tests:
    uses: ./.github/workflows/ci.yml

  build-and-release:
    needs: tests
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: tools/bibliosmith-launcher/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Two independent checks, both reported before the step exits: a run that
      # fails one still tells you where the other stands, which is what makes a
      # throwaway `-f tag=v0.0.0-gate-check` dispatch worth running.
      #
      # The notes check exists because only the tag used to be verified. The
      # release body is whatever RELEASE_NOTES.md happens to say, and nothing
      # tied the two together, so a tag could publish a download page describing
      # an older version — v1.12.1 was one step away from shipping v1.12.0's
      # notes, which mentioned none of its changes. The file names its own
      # version on the first line and that is what gets compared; it is compared
      # against launcher-version.json rather than the tag so the verdict is the
      # same whether or not the tag itself is right.
      - name: Verify version and release notes match the tag
        run: |
          failed=0
          version=$(node -p "require('./launcher-version.json').version")

          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "launcher-version.json is v$version but the release tag is $RELEASE_TAG" >&2
            failed=1
          else
            echo "launcher-version.json matches the release tag ($RELEASE_TAG)"
          fi

          heading=$(head -n 1 RELEASE_NOTES.md)
          if [ "$heading" != "# v$version" ]; then
            echo "RELEASE_NOTES.md starts with '$heading', expected '# v$version'" >&2
            echo "Rewrite the notes for this version before tagging: they become the release body verbatim." >&2
            failed=1
          else
            echo "RELEASE_NOTES.md is written for v$version"
          fi

          exit "$failed"

      - name: Install JS dependencies
        run: npm ci

      - name: Build DMG
        run: npx tauri build --bundles dmg

      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo semantic-craft/bibliosmith-releases \
            --title "BiblioSmith Launcher $RELEASE_TAG" \
            --notes-file tools/bibliosmith-launcher/source/RELEASE_NOTES.md \
            "tools/bibliosmith-launcher/source/src-tauri/target/release/bundle/dmg/"*.dmg
