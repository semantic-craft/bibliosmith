name: Release Launcher

# Builds the macOS (Apple Silicon) DMG on a GitHub-hosted macos-latest runner
# and publishes it as a GitHub release on this repository (manual download
# only — the app has no self-update).
#
# It used to publish to a separate public download repo,
# semantic-craft/bibliosmith-releases, which dated from when the source was
# private and was the only way to offer a public download. Publishing across
# repositories needs a token with write access to the other one, and no such
# secret was ever configured, so that last step had never once run. The source
# is public now, so the release belongs beside it and the built-in GITHUB_TOKEN
# is enough. Releases v1.4.0 through v1.12.0 stay where they are; recreating
# them here would mean inventing tags for commits this history does not have.
#
# The built-in token creates the release. Developer ID signing and Apple
# notarization credentials are repository secrets and are exposed only to the
# build-and-release job.
#
# Release flow: update tools/bibliosmith-launcher/source/launcher-version.json
# and tools/bibliosmith-launcher/source/RELEASE_NOTES.md, merge to main, then push a
# matching tag (e.g. v1.4.0). The tag runs the full CI suite first and the build
# only starts once it is green, so a tag on a red tree publishes nothing.
#
# RELEASE_NOTES.md must start with "# BiblioSmith Launcher <version>" matching
# launcher-version.json, and carry ## ZH, ## EN, and ## JA sections. Both are
# checked before the build; see "Verify release notes are not stale" below.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.4.0); must match launcher-version.json"
        required: true

concurrency: release-launcher

permissions:
  contents: read

jobs:
  # A tag used to go straight to build-and-release, so a red suite could still
  # ship a DMG to the download page. ci.yml is reused here rather than copied
  # so the release gate cannot drift from the pull-request gate.
  tests:
    uses: ./.github/workflows/ci.yml

  build-and-release:
    needs: tests
    runs-on: macos-latest
    # Only this job, and only contents: the workflow default above stays read,
    # so the reused test suite runs with no write access of its own.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: tools/bibliosmith-launcher/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Bumping the version proved nothing about the notes. RELEASE_NOTES.md is
      # the text the download page shows, and nothing checked it: v1.12.1 would
      # have shipped v1.12.0's OCR-settings copy and said nothing about the one
      # fix in the release. Require the file to name the version it describes.
      # Only the heading and the three language sections are pinned; the prose
      # under them is free.
      #
      # Deliberately before the tag check, not after. A dispatch with a throwaway
      # tag (-f tag=v0.0.0-gate-check) is how this gate gets exercised without
      # publishing anything: the tag check below then fails and the job stops
      # well before the build and release steps. If the tag check ran first, a
      # throwaway tag could never reach this step and the gate would be
      # unverifiable except by cutting a real release.
      - name: Verify release notes are not stale
        run: |
          version=$(node -p "require('./launcher-version.json').version")
          expected="# BiblioSmith Launcher $version"
          if ! head -n 1 RELEASE_NOTES.md | grep -Fqx "$expected"; then
            echo "RELEASE_NOTES.md must start with: $expected" >&2
            echo "It currently starts with: $(head -n 1 RELEASE_NOTES.md)" >&2
            echo "Rewrite the notes for $version before tagging." >&2
            exit 1
          fi
          for section in ZH EN JA; do
            if ! grep -Fqx "## $section" RELEASE_NOTES.md; then
              echo "RELEASE_NOTES.md is missing its ## $section section" >&2
              exit 1
            fi
          done

      - name: Verify version matches tag
        run: |
          version=$(node -p "require('./launcher-version.json').version")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "launcher-version.json is v$version but the release tag is $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/bibliosmith-signing.keychain-db"
          trap 'rm -f "$certificate_path"' EXIT

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "Imported certificate does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --bundles dmg

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one release DMG, found ${#dmgs[@]}." >&2
            exit 1
          fi
          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"

      - name: Verify signed and notarized release
        run: |
          shopt -s nullglob
          apps=(src-tauri/target/release/bundle/macos/*.app)
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one release app, found ${#apps[@]}." >&2
            exit 1
          fi
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one release DMG, found ${#dmgs[@]}." >&2
            exit 1
          fi
          ./scripts/verify-macos-release.sh "${apps[0]}" "${dmgs[0]}"

      # --repo is github.repository rather than a literal, so a fork that pushes
      # a tag publishes to itself instead of trying to write here.
      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BiblioSmith Launcher $RELEASE_TAG" \
            --notes-file tools/bibliosmith-launcher/source/RELEASE_NOTES.md \
            "tools/bibliosmith-launcher/source/src-tauri/target/release/bundle/dmg/"*.dmg

      - name: Delete temporary signing keychain
        if: ${{ always() }}
        run: security delete-keychain "$RUNNER_TEMP/bibliosmith-signing.keychain-db" || true
